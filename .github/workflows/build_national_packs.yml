name: Build national packs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-national-packs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Build national packs
        run: python scripts/build_national_packs.py

      - name: Commit generated national packs
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add countries/DE/national.json countries/DE/national_manifest.json
          git commit -m "Build Germany national food pack" || echo "No changes to commit"
          git push
