name: Build national packs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: write

jobs:
  build-national-packs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Build national packs
        run: python scripts/build_national_packs.py

      - name: Commit generated national packs
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add \
            countries/DE/national.json \
            countries/DE/national_manifest.json \
            countries/FR/national.json \
            countries/FR/national_manifest.json \
            countries/CA/national.json \
            countries/CA/national_manifest.json \
            countries/GB/national.json \
            countries/GB/national_manifest.json
            
          git commit -m "Build national food packs" || echo "No changes to commit"
          git push
