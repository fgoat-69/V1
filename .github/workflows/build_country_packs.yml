name: Build country packs

on:
  workflow_dispatch:
    inputs:
      country_batch:
        description: "Optional batch name"
        required: false
        default: "batch_13_north_america"
      country_filter:
        description: "Optional comma-separated ISO2 codes (overrides batch)"
        required: false
        default: ""
      force_download:
        description: "Force re-download of OFF dump"
        required: false
        default: "false"
      skip_existing:
        description: "Skip countries that already have a manifest.json"
        required: false
        default: "false"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: build-country-packs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      OFF_USER_AGENT: MostoFitCountryPackBuilder/1.0 (szegedi.kristof12@gmail.com)
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Cache OFF dump
        uses: actions/cache@v4
        with:
          path: .cache
          key: off-dump-${{ runner.os }}-${{ hashFiles('scripts/build_country_pack.py', 'scripts/build_all_packs.py') }}
          restore-keys: |
            off-dump-${{ runner.os }}-

      - name: Debug inputs
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "country_batch=${{ github.event.inputs.country_batch }}"
          echo "country_filter=${{ github.event.inputs.country_filter }}"
          echo "force_download=${{ github.event.inputs.force_download }}"
          echo "skip_existing=${{ github.event.inputs.skip_existing }}"

      - name: Run builder
        run: python scripts/build_all_packs.py
        env:
          COUNTRY_BATCH: ${{ github.event.inputs.country_batch }}
          COUNTRY_FILTER: ${{ github.event.inputs.country_filter }}
          FORCE_DOWNLOAD: ${{ github.event.inputs.force_download }}
          SKIP_EXISTING: ${{ github.event.inputs.skip_existing }}
          
      - name: Validate generated OFF packs
        run: python scripts/validate_packs.py
        env:
          COUNTRY_BATCH: ${{ matrix.country_batch }}
          COUNTRY_FILTER: ""
          
      - name: Validate generated OFF packs
        run: python scripts/validate_packs.py
        env:
          COUNTRY_BATCH: ${{ github.event.inputs.country_batch }}
          COUNTRY_FILTER: ${{ github.event.inputs.country_filter }}

      - name: Stage batch output artifact
        env:
          COUNTRY_BATCH: ${{ github.event.inputs.country_batch }}
          COUNTRY_FILTER: ${{ github.event.inputs.country_filter }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(".").resolve()
          scripts_dir = root / "scripts"
          sys.path.insert(0, str(scripts_dir))

          stage = root / "artifact_out"
          if stage.exists():
              shutil.rmtree(stage)
          (stage / "countries").mkdir(parents=True, exist_ok=True)

          spec = importlib.util.spec_from_file_location(
              "build_all_packs",
              scripts_dir / "build_all_packs.py",
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          country_filter = os.getenv("COUNTRY_FILTER", "").strip()
          country_batch = os.getenv("COUNTRY_BATCH", "").strip()

          selected = []

          if country_filter:
              selected = [token.strip().upper() for token in country_filter.split(",") if token.strip()]
          elif country_batch and country_batch in mod.COUNTRY_BATCHES:
              selected = list(mod.COUNTRY_BATCHES[country_batch])
          else:
              built_root = root / "countries"
              if built_root.exists():
                  selected = [p.name for p in built_root.iterdir() if p.is_dir()]

          if not selected:
              raise RuntimeError("No countries detected to stage")

          for iso2 in selected:
              src = root / "countries" / iso2
              if src.exists():
                  shutil.copytree(src, stage / "countries" / iso2)

          print("Staged countries:", ", ".join(selected))
          PY

      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pack-output
          path: artifact_out

  build-batches:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        country_batch:
          - batch_01_europe_north_west
          - batch_02_europe_central
          - batch_03_europe_south_west
          - batch_04_europe_south_east
          - batch_05_europe_east_caucasus
          - batch_06_middle_east
          - batch_07_central_south_asia
          - batch_08_east_south_east_asia
          - batch_09_africa_north_west
          - batch_10_africa_west
          - batch_11_africa_central_east
          - batch_12_africa_south_indian_ocean
          - batch_13_north_america
          - batch_14_central_america_caribbean
          - batch_15_south_america
          - batch_16_oceania_pacific
          - batch_17_misc_small_states

    env:
      OFF_USER_AGENT: MostoFitCountryPackBuilder/1.0 (szegedi.kristof12@gmail.com)
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Cache OFF dump
        uses: actions/cache@v4
        with:
          path: .cache
          key: off-dump-${{ runner.os }}-${{ hashFiles('scripts/build_country_pack.py', 'scripts/build_all_packs.py') }}
          restore-keys: |
            off-dump-${{ runner.os }}-

      - name: Run builder
        run: python scripts/build_all_packs.py
        env:
          COUNTRY_BATCH: ${{ matrix.country_batch }}
          COUNTRY_FILTER: ""
          FORCE_DOWNLOAD: "false"
          SKIP_EXISTING: "false"

      - name: Stage batch output artifact
        env:
          COUNTRY_BATCH: ${{ matrix.country_batch }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import pathlib
          import shutil
          import sys

          root = pathlib.Path(".").resolve()
          scripts_dir = root / "scripts"
          sys.path.insert(0, str(scripts_dir))

          stage = root / "artifact_out"
          if stage.exists():
              shutil.rmtree(stage)
          (stage / "countries").mkdir(parents=True, exist_ok=True)

          spec = importlib.util.spec_from_file_location(
              "build_all_packs",
              scripts_dir / "build_all_packs.py",
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          country_batch = os.getenv("COUNTRY_BATCH", "").strip()
          selected = list(mod.COUNTRY_BATCHES[country_batch])

          for iso2 in selected:
              src = root / "countries" / iso2
              if src.exists():
                  shutil.copytree(src, stage / "countries" / iso2)

          print("Staged countries:", ", ".join(selected))
          PY

      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.country_batch }}-pack-output
          path: artifact_out

  merge-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build-manual.result == 'success' }}
    needs:
      - build-manual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download manual artifact
        uses: actions/download-artifact@v4
        with:
          path: collected_artifacts
          pattern: "manual-pack-output"
          merge-multiple: true

      - name: Merge country folders into repo
        run: |
          python - <<'PY'
          import pathlib
          import shutil

          repo_countries = pathlib.Path("countries")
          repo_countries.mkdir(exist_ok=True)

          collected = pathlib.Path("collected_artifacts") / "countries"
          if not collected.exists():
              raise RuntimeError("No collected country artifacts found.")

          for country_dir in collected.iterdir():
              if not country_dir.is_dir():
                  continue
              target = repo_countries / country_dir.name
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(country_dir, target)
              print(f"Merged {country_dir.name}")
          PY

      - name: Rebuild index and failures
        run: |
          python - <<'PY'
          import json
          import pathlib
          from datetime import datetime, timezone

          countries_root = pathlib.Path("countries")
          manifests = []

          for child in sorted(countries_root.iterdir()):
              if not child.is_dir():
                  continue

              manifest_path = child / "manifest.json"
              if not manifest_path.exists():
                  continue

              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifests.append(json.load(f))

          index_payload = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "countryCount": len(manifests),
              "countries": sorted(manifests, key=lambda x: x["countryIso2"]),
          }

          failures_payload = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "failureCount": 0,
              "failures": [],
          }

          with open(countries_root / "index.json", "w", encoding="utf-8") as f:
              json.dump(index_payload, f, ensure_ascii=False, indent=2)

          with open(countries_root / "failures.json", "w", encoding="utf-8") as f:
              json.dump(failures_payload, f, ensure_ascii=False, indent=2)

          print(f"Rebuilt countries/index.json with {len(manifests)} manifests")
          PY

      - name: Commit merged results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add countries

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update country packs"
          git push

  merge-scheduled:
    if: ${{ github.event_name == 'schedule' && needs.build-batches.result == 'success' }}
    needs:
      - build-batches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected_artifacts
          pattern: "batch-*-pack-output"
          merge-multiple: true

      - name: Merge country folders into repo
        run: |
          python - <<'PY'
          import pathlib
          import shutil

          repo_countries = pathlib.Path("countries")
          repo_countries.mkdir(exist_ok=True)

          collected = pathlib.Path("collected_artifacts") / "countries"
          if not collected.exists():
              raise RuntimeError("No collected country artifacts found.")

          for country_dir in collected.iterdir():
              if not country_dir.is_dir():
                  continue
              target = repo_countries / country_dir.name
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(country_dir, target)
              print(f"Merged {country_dir.name}")
          PY

      - name: Rebuild index and failures
        run: |
          python - <<'PY'
          import json
          import pathlib
          from datetime import datetime, timezone

          countries_root = pathlib.Path("countries")
          manifests = []

          for child in sorted(countries_root.iterdir()):
              if not child.is_dir():
                  continue

              manifest_path = child / "manifest.json"
              if not manifest_path.exists():
                  continue

              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifests.append(json.load(f))

          index_payload = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "countryCount": len(manifests),
              "countries": sorted(manifests, key=lambda x: x["countryIso2"]),
          }

          failures_payload = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "failureCount": 0,
              "failures": [],
          }

          with open(countries_root / "index.json", "w", encoding="utf-8") as f:
              json.dump(index_payload, f, ensure_ascii=False, indent=2)

          with open(countries_root / "failures.json", "w", encoding="utf-8") as f:
              json.dump(failures_payload, f, ensure_ascii=False, indent=2)

          print(f"Rebuilt countries/index.json with {len(manifests)} manifests")
          PY

      - name: Commit merged results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add countries

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update country packs"
          git push
