name: Build country packs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      country_filter:
        description: "Comma-separated ISO2 codes (e.g. HU,RO)"
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OFF_USER_AGENT: MostoFitCountryPackBuilder/1.0 (your-email@example.com)
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run builder
        run: python scripts/build_all_packs.py
        env:
          COUNTRY_FILTER: ${{ inputs.country_filter }}

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add countries

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update country packs"
          git push
