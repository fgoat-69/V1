name: Build country packs

on:
  workflow_dispatch:
    inputs:
      country_filter:
        description: "Comma-separated ISO2 codes (e.g. HU,RO)"
        required: false
        default: "HU"
      force_download:
        description: "Force re-download of OFF dump"
        required: false
        default: "false"
      skip_existing:
        description: "Skip countries that already have a manifest.json"
        required: false
        default: "false"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: build-country-packs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OFF_USER_AGENT: MostoFitCountryPackBuilder/1.0 (szegedi.kristof12@gmail.com)
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Debug inputs
        run: |
          echo "country_filter=${{ github.event.inputs.country_filter }}"
          echo "force_download=${{ github.event.inputs.force_download }}"
          echo "skip_existing=${{ github.event.inputs.skip_existing }}"

      - name: Run builder
        run: python scripts/build_all_packs.py
        env:
          COUNTRY_FILTER: ${{ github.event.inputs.country_filter }}
          FORCE_DOWNLOAD: ${{ github.event.inputs.force_download }}
          SKIP_EXISTING: ${{ github.event.inputs.skip_existing }}

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add countries

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update country packs"
          git push
